hotfix:
  root_cause: >
    The vendored Quartz parser registered remark-parse and configured community
    transformers but no YAML frontmatter transformer, so leading metadata was
    parsed as ordinary Markdown body content.
  fix: >
    Register a built-in FrontMatter transformer before configured plugins; it
    parses the leading YAML node into VFile frontmatter data and removes it
    from the Markdown AST.
